name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: KIMI_API_KEY=test GATEWAY_API_KEY=test python -m compileall app
      - run: KIMI_API_KEY=test GATEWAY_API_KEY=test python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check app/static/app.js
      - run: node --check app/static/agent/api.js
      - run: node --check app/static/agent/store.js
      - run: node --check app/static/agent/component.js
      - run: node --check app/static/agent/main.js
