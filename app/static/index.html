<!doctype html>
<html lang="ar" dir="rtl" data-theme="light" data-workspace-mode="chat">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f8">
  <meta name="description" content="Kimi Workspace — محادثة ووكيل برمجي آمن">
  <title>Kimi Workspace</title>
  <link rel="stylesheet" href="/static/styles.css?v=4">
  <link rel="stylesheet" href="/static/agent/agent.css?v=4">
</head>
<body>
  <div id="authOverlay" class="auth-overlay" role="dialog" aria-modal="true" aria-labelledby="authTitle">
    <form id="authForm" class="auth-card" autocomplete="off">
      <div class="auth-logo" aria-hidden="true">K</div>
      <h1 id="authTitle">Kimi Workspace</h1>
      <p class="auth-copy">أدخل مفتاح البوابة للمتابعة إلى مساحة العمل.</p>

      <label class="field-label" for="gatewayKey">مفتاح الدخول</label>
      <div class="secret-field">
        <input id="gatewayKey" type="password" placeholder="GATEWAY_API_KEY" required spellcheck="false" autocomplete="current-password">
        <button id="toggleSecret" type="button" class="text-button" aria-label="إظهار المفتاح">إظهار</button>
      </div>

      <label class="remember-row">
        <input id="rememberKey" type="checkbox">
        <span>تذكّر المفتاح على هذا المتصفح</span>
      </label>

      <p id="authError" class="auth-error" role="alert"></p>
      <button id="authSubmit" class="primary-button" type="submit"><span>متابعة</span></button>
      <p class="security-note">يُرسل المفتاح عبر HTTPS ولا يُخزّن داخل كود المشروع.</p>
    </form>
  </div>

  <div id="appShell" class="app-shell is-locked">
    <aside id="sidebar" class="sidebar" aria-label="المحادثات">
      <div class="sidebar-brand">
        <div class="brand-mark" aria-hidden="true">K</div>
        <strong>Kimi</strong>
        <button id="closeSidebar" class="icon-button sidebar-close mobile-only" type="button" aria-label="إغلاق القائمة">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>

      <button id="newChatButton" class="new-chat-button" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span>محادثة جديدة</span>
      </button>

      <div class="search-box">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="conversationSearch" type="search" placeholder="البحث في المحادثات" aria-label="البحث في المحادثات">
      </div>

      <div class="sidebar-section-label">
        <span>المحادثات</span>
        <span id="conversationCount" class="count-badge">0</span>
      </div>
      <nav id="conversationList" class="conversation-list"></nav>

      <div class="sidebar-footer">
        <button id="exportButton" class="sidebar-action" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 21h14"/></svg>
          <span>تصدير</span>
        </button>
        <button id="deleteButton" class="sidebar-action danger" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3m3 0-1 14H7L6 7"/></svg>
          <span>حذف</span>
        </button>
      </div>
    </aside>

    <div id="sidebarBackdrop" class="sidebar-backdrop" aria-hidden="true"></div>

    <main class="workspace">
      <header class="topbar">
        <div class="topbar-start">
          <button id="openSidebar" class="icon-button mobile-only" type="button" aria-label="فتح المحادثات">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
          <div class="conversation-heading">
            <p id="conversationTitle">محادثة جديدة</p>
            <div class="connection-line">
              <span id="connectionDot" class="status-dot" data-state="pending"></span>
              <span id="connectionStatus">جاري الاتصال…</span>
            </div>
          </div>
        </div>

        <div class="topbar-actions">
          <button id="themeButton" class="icon-button" type="button" aria-label="تبديل المظهر">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/></svg>
          </button>
          <button id="lockButton" class="icon-button" type="button" aria-label="تغيير مفتاح الدخول">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          </button>
        </div>
      </header>

      <section id="messages" class="messages" aria-live="polite" aria-label="رسائل المحادثة"></section>

      <div class="composer-wrap">
        <div class="composer-stack">
          <div class="composer-control-row">
            <div id="workspaceModeSwitch" class="workspace-mode-switch" aria-label="وضع مساحة العمل">
              <button id="modeChatButton" class="active" type="button" data-mode="chat" aria-pressed="true">محادثة</button>
              <button id="modeAgentButton" type="button" data-mode="agent" aria-pressed="false">وكيل</button>
            </div>

            <label class="model-picker" for="modelSelect">
              <span class="model-dot" aria-hidden="true"></span>
              <select id="modelSelect" aria-label="اختيار نموذج Kimi"></select>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 10 4 4 4-4"/></svg>
            </label>
          </div>

          <form id="composer" class="composer">
            <textarea id="messageInput" rows="1" maxlength="100000" placeholder="اسأل Kimi أي شيء…" aria-label="رسالتك"></textarea>
            <div class="composer-bottom">
              <span class="composer-hint">Shift + Enter لسطر جديد</span>
              <button id="sendButton" class="send-button" type="submit" aria-label="إرسال">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m0 0-5 5m5-5 5 5"/></svg>
              </button>
            </div>
          </form>
          <p class="footer-note">قد يخطئ Kimi. راجع التغييرات المهمة قبل اعتمادها.</p>
        </div>
      </div>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/static/chat/main.js?v=1"></script>
  <script type="module" src="/static/agent/main.js?v=4"></script>
</body>
</html>
